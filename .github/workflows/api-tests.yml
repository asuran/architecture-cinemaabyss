name: API Tests

on:
  push:
    branches: [ main, master, cinema ]
  pull_request:
    branches: [ main, master, cinema ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: false
        default: 'docker'
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          docker compose up -d
          # Wait for services to be ready
          echo "Waiting for services to be ready..."
          sleep 120
          
          # Check if services are running
          docker compose ps
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Wait for services to be healthy
        run: |
          echo "Checking service health..."
          # Wait for proxy service to be ready
          timeout 60 bash -c 'until curl -f http://localhost:8000/health 2>/dev/null; do sleep 2; done' || echo "Proxy service health check failed"
          # Wait for events service to be ready  
          timeout 60 bash -c 'until curl -f http://localhost:8082/health 2>/dev/null; do sleep 2; done' || echo "Events service health check failed"
          # Wait for movies service to be ready
          timeout 60 bash -c 'until curl -f http://localhost:8081/health 2>/dev/null; do sleep 2; done' || echo "Movies service health check failed"
          echo "Services health check completed"
      
      - name: Run API tests
        working-directory: tests/postman
        run: |
          # Build the Docker image for tests
          docker build -t cinemaabyss-api-tests .
          
          # Run the tests in Docker
          docker run --network=cinemaabyss-network -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests --environment docker
        
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/postman/reports/
          retention-days: 30
      
      - name: Stop services
        if: always()
        run: docker compose down